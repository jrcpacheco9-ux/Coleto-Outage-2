<title>Coleto Outage Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#EEF0EC; --panel:#FFFFFF; --panel2:#F6F7F4; --ink:#1A2320; --ink2:#55605B; --line:#D3D8D1;
  --accent:#D4501A; --accent-ink:#FFFFFF; --accent-soft:#FBE7DD;
  --ok:#2A7A4B; --ok-soft:#DDEFE3; --prog:#2560AE; --prog-soft:#DCE8F7; --late:#B3342A; --late-soft:#F8DEDA; --idle:#8A948E; --idle-soft:#E6E9E4;
  --track:#D9DED7; --shadow:0 1px 2px rgba(20,30,25,.08);
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121816; --panel:#1B2420; --panel2:#222C28; --ink:#E6ECE8; --ink2:#9CA8A1; --line:#33403A;
  --accent:#F27C40; --accent-ink:#1A1410; --accent-soft:#3A251A;
  --ok:#5CC48A; --ok-soft:#1D3327; --prog:#6FA6EA; --prog-soft:#1C2C42; --late:#F0776C; --late-soft:#432420; --idle:#7F8A84; --idle-soft:#2A3430;
  --track:#33403A; --shadow:none;}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121816; --panel:#1B2420; --panel2:#222C28; --ink:#E6ECE8; --ink2:#9CA8A1; --line:#33403A;
  --accent:#F27C40; --accent-ink:#1A1410; --accent-soft:#3A251A;
  --ok:#5CC48A; --ok-soft:#1D3327; --prog:#6FA6EA; --prog-soft:#1C2C42; --late:#F0776C; --late-soft:#432420; --idle:#7F8A84; --idle-soft:#2A3430;
  --track:#33403A; --shadow:none;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1280px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;flex-direction:column;margin-right:auto}
h1{font:700 26px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;margin:0}
.sub{font-size:12px;color:var(--ink2)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:2px}
.field>label,.lbl{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
input[type=date],input[type=datetime-local],input[type=text],input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:32px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;min-height:32px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;min-height:34px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(.96)}
.banner{margin-top:10px;padding:8px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-block:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.kpi b{font:700 28px/1.05 var(--f-disp);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kpi span{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kpi.late b{color:var(--late)} .kpi.ok b{color:var(--ok)} .kpi.prog b{color:var(--prog)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:8px 14px;font:700 17px var(--f-disp);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;display:flex;gap:6px;align-items:center;font-size:12.5px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.zero{opacity:.5}
.chip i{font:500 11px var(--f-mono);font-style:normal;opacity:.75}
.chiptools{display:flex;gap:10px;font-size:12px;margin-bottom:6px;align-items:center;color:var(--ink2)}
.chiptools button{border:0;background:none;text-decoration:underline;color:var(--ink2);padding:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}
.tools .grow{flex:1;min-width:180px}
.tools .grow input{width:100%}
.chk{display:flex;gap:6px;align-items:center;min-height:32px;font-size:13px}
.count{color:var(--ink2);font-size:12px;margin-bottom:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;gap:8px 16px;grid-template-columns:150px minmax(0,1fr) 230px auto;grid-template-areas:"id name pct stat" "id delay delay delay" "id note note note";box-shadow:var(--shadow)}
.row.s-complete{background:var(--ok-soft);border-color:transparent}
.row.s-delayed{border-color:var(--late)}
.rid{grid-area:id;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rid code{font:500 13px var(--f-mono)}
.tag{font-size:11px;background:var(--idle-soft);border-radius:4px;padding:1px 6px;color:var(--ink2)}
.tag.grp{background:var(--accent-soft);color:var(--ink)}
.rname{grid-area:name;min-width:0}
.rname b{font-weight:600;display:block;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--ink2);margin-top:2px}
.meta .mono{font-family:var(--f-mono);font-size:11.5px}
.sup{display:inline-block;margin-left:6px;color:var(--ink)}
.rpct{grid-area:pct;display:flex;flex-direction:column;gap:2px}
.pctline{display:flex;align-items:baseline;justify-content:space-between}
.pctline output{font:700 22px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.plan{font:400 11px var(--f-mono);color:var(--ink2)}
.plan.behind{color:var(--late)}
.slid{position:relative;height:22px;display:flex;align-items:center}
.slid input{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:22px;background:transparent;position:relative;z-index:1}
.slid input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--fill) var(--p),var(--track) var(--p))}
.slid input::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--fill) var(--p),var(--track) var(--p))}
.slid input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--panel);border:3px solid var(--fill);margin-top:-6px}
.slid input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--fill)}
.tick{position:absolute;top:2px;bottom:2px;width:2px;background:var(--ink);opacity:.55;z-index:0;pointer-events:none}
.s-notstarted{--fill:var(--idle)} .s-progress{--fill:var(--prog)} .s-delayed{--fill:var(--late)} .s-complete{--fill:var(--ok)}
.rstat{grid-area:stat;align-self:center}
.rstat.seg button{padding:6px 9px;font-size:12.5px}
.rstat.seg button[aria-pressed=true][data-st=notstarted]{background:var(--idle);color:#fff}
.rstat.seg button[aria-pressed=true][data-st=progress]{background:var(--prog);color:#fff}
.rstat.seg button[aria-pressed=true][data-st=delayed]{background:var(--late);color:#fff}
.rstat.seg button[aria-pressed=true][data-st=complete]{background:var(--ok);color:#fff}
.rdelay{grid-area:delay;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--late-soft);border-radius:6px;padding:6px 8px}
.rdelay span{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--late)}
.rdelay select.need{border-color:var(--late);border-style:dashed}
.rnote{grid-area:note;display:flex;gap:8px;flex-wrap:wrap}
.rnote input[type=text]{flex:1;min-width:160px}
.rnote select{max-width:230px}
.more{display:block;margin:12px auto}
.empty{padding:40px 16px;text-align:center;color:var(--ink2);background:var(--panel);border:1px dashed var(--line);border-radius:8px}
.crews{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.crew{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.crew h3{margin:0;font:700 19px var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.crew .n{font-size:12px;color:var(--ink2)}
.crew .field input{width:100%}
.crewbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}
.veil{position:fixed;inset:0;background:rgba(10,15,12,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:700 24px var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal p{margin:0;color:var(--ink2);font-size:13px}
.list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:400 12px var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:80;max-width:calc(100% - 32px)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px;margin-bottom:12px}
.gcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.gcard[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gh b{font:700 18px/1.1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.gp{font:700 24px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.gbar{position:relative;height:8px;border-radius:4px;background:var(--track)}
.gbar i{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--ok);border-radius:4px}
.gbar u{position:absolute;top:-3px;bottom:-3px;left:var(--pl);width:2px;background:var(--ink);opacity:.6}
.gm{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ink2)}
.gm .ok{color:var(--ok)} .gm .prog{color:var(--prog)} .gm .late{color:var(--late);font-weight:600}
.gs{font-size:12px}
.gs.none{color:var(--ink2)}
.flag{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--late-soft);color:var(--late);border-radius:4px;padding:1px 6px;align-self:flex-start}
details.grpdet{margin-bottom:10px}
details.grpdet summary{cursor:pointer;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.dfield{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink2)}
.dfield input{min-width:172px}
.lnk{border:0;background:none;color:var(--ink2);text-decoration:underline;padding:0;font-size:12px;min-height:24px}
@media (max-width:900px){
  .row{grid-template-columns:minmax(0,1fr);grid-template-areas:"id" "name" "pct" "stat" "delay" "note"}
  .rid{flex-direction:row;flex-wrap:wrap;align-items:center}
  .rstat.seg{display:grid;grid-template-columns:repeat(4,1fr)}
  .rstat.seg button{padding-inline:2px}
}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
<header class="top">
  <div class="brand"><h1>Coleto Outage Log</h1><span class="sub">Coal-to-gas conversion · Fluor / Vistra · update form of 25-Sep-26</span></div>
  <div class="ctl">
    <div class="field"><label for="date">Date</label><input type="date" id="date"></div>
    <div class="field"><span class="lbl">Shift</span><div class="seg" id="shiftSeg" role="group" aria-label="Shift">
      <button data-v="day">Day 07-19</button><button data-v="night">Night 19-07</button><button data-v="both">24 hr</button></div></div>
    <div class="field"><span class="lbl">Show</span><div class="seg" id="viewSeg" role="group" aria-label="Show">
      <button data-v="window">This shift</button><button data-v="all">All dates</button></div></div>
    <button class="btn" id="jump" title="Jump to the first outage work day">Outage start</button>
    <button class="btn pri" id="btnExport">Export handouts</button>
    <button class="btn" id="btnReport">Shift report</button>
    <button class="btn" id="btnForm">Update form PDF</button>
    <button class="btn" id="btnImport">Import updates</button>
    <input type="file" id="file" accept=".xlsx" hidden>
  </div>
</header>
<div id="banner"></div>
<section class="kpis" id="kpis" aria-label="Summary"></section>
<div class="tabs" role="tablist"><button role="tab" data-tab="log" aria-selected="true">Log</button><button role="tab" data-tab="crews" aria-selected="false">Crews &amp; supervisors</button></div>

<div id="viewLog">
  <section class="board" id="board" aria-label="Groups"></section>
  <details class="grpdet" id="grpdet"><summary id="grpSum">Groups shown</summary>
    <div class="chiptools"><button id="allOn">all</button><button id="allOff">none</button><button id="fluorOnly">Fluor scope</button></div>
    <div class="chips" id="chips"></div></details>
  <div class="tools">
    <div class="field grow"><label for="q">Search</label><input type="search" id="q" placeholder="ID or words, e.g. BA-17, hopper, burner"></div>
    <div class="field"><label for="co">Company</label><select id="co"></select></div>
    <div class="field"><label for="st">Status</label><select id="st"><option value="">All</option><option value="notstarted">Not started</option><option value="progress">In progress</option><option value="delayed">Delayed</option><option value="complete">Complete</option></select></div>
    <label class="chk"><input type="checkbox" id="carry" checked> Include started work past its finish date</label>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<div id="viewCrews" hidden></div>
</div>
<div id="modalHost"></div>

const AREA_ORDER = ['Burners','Bottom Ash','Lower Slope','Baffles','PA/FD Ducts','Baghouse / Bypass Duct','Boiler Setup / Scaffold','Boiler Close-out','Cleaning / Hydroblast','Vent Valves'];

const T = s => { const m=/^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(s); return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]); };
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2 = n => String(n).padStart(2,'0');
const fmt = ms => { const d=new Date(ms); return `${DAYS[d.getUTCDay()]} ${p2(d.getUTCDate())}-${MON[d.getUTCMonth()]} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const isoDate = ms => { const d=new Date(ms); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}`; };
const nowSite = () => { const d=new Date(); return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes()); };
const HR = 3600000;
ACT.forEach(a=>{ a.t0=T(a.s); a.t1=T(a.f); if(a.t1<a.t0) a.t1=a.t0; });
const SCHED_MIN = Math.min(...ACT.map(a=>a.t0)), SCHED_MAX = Math.max(...ACT.map(a=>a.t1));

const S = {
  date: isoDate(Math.min(Math.max(nowSite(), SCHED_MIN), SCHED_MAX)), shift:'day', view:'window', carry:true,
  areas:new Set(AREA_ORDER.filter(a=>FLUOR_SCOPE.has(a))), co:'', st:'', q:'', focus:'', open:new Set(), limit:120, tab:'log',

};
const LS='coleto-log-v1';

/* ---------- state helpers ---------- */
function crewList(){ // ordered group names incl. custom
  const names=[...AREA_ORDER]; S.crews.forEach(c=>{ if(!names.includes(c.name)) names.push(c.name); }); return names;
}
function crewOf(name){ return S.crews.find(c=>c.name===name); }
function getState(a){
  const p=S.progress[key(a.id)];
  if(p) return {pct:p.pct??0,status:p.status||'notstarted',reason:p.reason||'',hrs:p.hrs||0,note:p.note||'',area:p.area||a.area,sAct:p.sAct||'',fAct:p.fAct||'',ant:p.ant||''};
  return {pct:0,status:'notstarted',reason:'',hrs:0,note:'',area:a.area,sAct:'',fAct:'',ant:''};
}
const isoT = ms => { const d=new Date(ms); return `${isoDate(ms)}T${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const stampNow = () => { const d=new Date(); return isoT(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes())); };
function formIso(s){ const m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(s||''); return m?`${m[3]}-${MON[+m[2]-1]}-${m[1].slice(2)} ${m[4]}:${m[5]}`:''; }
function parseFormDate(v){
  if(v===null||v===undefined||v==='') return '';
  if(v instanceof Date) return isoT(Date.UTC(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate(),v.getUTCHours(),v.getUTCMinutes()));
  const s=String(v).trim(); let m=/^(\d{1,2})-([A-Za-z]{3})[a-z]*-(\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/.exec(s);
  if(m){ const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase()); if(mi<0) return ''; let y=+m[3]; if(y<100) y+=2000; return `${y}-${p2(mi+1)}-${p2(+m[1])}T${p2(+(m[4]||0))}:${m[5]||'00'}`; }
  m=/^(\d{4})-(\d\d)-(\d\d)[ T](\d{1,2}):(\d\d)/.exec(s); if(m) return `${m[1]}-${m[2]}-${m[3]}T${p2(+m[4])}:${m[5]}`;
  return '';
}
function win(dateStr=S.date, shift=S.shift){
  const [y,m,d]=dateStr.split('-').map(Number); const b=Date.UTC(y,m-1,d,7,0);
  if(shift==='day') return [b,b+12*HR]; if(shift==='night') return [b+12*HR,b+24*HR]; return [b,b+24*HR];
}
function planPct(a,at){ if(a.dur===0||a.t1===a.t0) return at>=a.t0?100:0; return Math.round(Math.max(0,Math.min(1,(at-a.t0)/(a.t1-a.t0)))*100); }
function activeIn(a,[w0,w1],carry){
  const st=getState(a);
  if(a.dur===0||a.t1===a.t0){ if(a.t0>=w0&&a.t0<w1) return true; }
  else if(a.t0<w1 && a.t1>w0) return true;
  if(carry && a.t1<=w0 && (st.status==='progress'||st.status==='delayed')) return true;
  return false;
}
function supFor(area,shift){ const c=crewOf(area); if(!c) return ''; return shift==='night'?c.night:shift==='day'?c.day:[c.day,c.night].filter(Boolean).join(' / '); }

/* ---------- persistence ---------- */
function loadLocal(){ try{ const j=JSON.parse(localStorage.getItem(LS)||'{}'); if(j.progress) S.progress=j.progress; if(j.crews) S.crews=j.crews; }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify({progress:S.progress,crews:S.crews})); }catch(e){} }
function persistProgress(a,n){
  const k=key(a.id);
  if(S.db){ S.db.doc('progress/'+k).set({...n,id:a.id,u:Date.now()}).catch(e=>toast('Not saved: '+(e&&e.message||'no write access'))); }
  else saveLocal();
}
function persistCrews(){
  if(S.db){ S.db.doc('settings/crews').set({groups:S.crews}).catch(e=>toast('Not saved: '+(e&&e.message||'no write access'))); }
  else saveLocal();
}
function commit(a,patch){
  const cur=getState(a); const n={...cur,...patch};
  if('status' in patch){
    if(n.status==='complete') n.pct=100;
    else if(n.status==='notstarted') n.pct=0;

  } else if('pct' in patch){
    if(n.pct>=100) n.status='complete';

  if(n.status!=='notstarted' && !n.sAct) n.sAct=ts;
  if(n.status==='notstarted' && !('sAct' in patch)) n.sAct='';
  if(n.status==='complete' && !n.fAct) n.fAct=ts;
  if(n.status!=='complete' && !('fAct' in patch)) n.fAct='';
  if(n.status==='complete') n.ant='';
  if('hrs' in patch && n.status==='delayed' && n.hrs && !n.ant && !('ant' in patch)) n.ant=isoT(a.t1+n.hrs*HR);
  S.progress[key(a.id)]=n; persistProgress(a,n); return n;
}

function visible(){
  const w=win(); const q=S.q.trim().toLowerCase(); const order=crewList();
  const list=ACT.filter(a=>{
    const st=getState(a);
    if(!S.areas.has(st.area)) return false;
    if(S.focus && st.area!==S.focus) return false;
    if(S.co && a.co!==S.co) return false;
    if(S.st && st.status!==S.st) return false;
    if(q && !(a.id.toLowerCase().includes(q)||a.nm.toLowerCase().includes(q)||a.sg.toLowerCase().includes(q))) return false;
    if(S.view==='window' && !activeIn(a,w,S.carry)) return false;
    return true;
  });
  list.sort((x,y)=>order.indexOf(getState(x).area)-order.indexOf(getState(y).area)||x.t0-y.t0||x.id.localeCompare(y.id,undefined,{numeric:true}));
  return list;
}

}

const inW=(t,w)=>t>=w[0]&&t<w[1];
const SHIFT_LABEL={day:'Day Shift',night:'Night Shift',both:'24 hr'};
const blank=()=>({n:0,complete:0,progress:0,delayed:0,notstarted:0,ws:0,wp:0,wt:0,dh:0});
const pctOf=g=>g.wt?Math.round(g.ws/g.wt):0, planOf=g=>g.wt?Math.round(g.wp/g.wt):0;
function reportData(date,shift){
  const w=win(date,shift); const order=crewList(); const groups=new Map(); const tot=blank();
  const delays=[],done=[],behind=[],notes=[];
  ACT.forEach(a=>{
    const st=getState(a); if(!S.areas.has(st.area)) return;
    const fT=st.fAct?T(st.fAct.replace(' ','T')):null;
    const doneHere=st.status==='complete'&&((fT!==null&&inW(fT,w))||(fT===null&&inW(a.t1,w)));
    if(!activeIn(a,w,S.carry)&&!doneHere) return;
    const pl=planPct(a,w[1]), wg=Math.max(a.dur,1);
    let g=groups.get(st.area); if(!g){ g=blank(); groups.set(st.area,g); }
    for(const x of [g,tot]){ x.n++; x[st.status]++; x.ws+=st.pct*wg; x.wp+=pl*wg; x.wt+=wg; x.dh+=st.hrs||0; }
    const r={a,st,pl,sup:supFor(st.area,shift==='both'?'':shift)};
    if(st.status==='delayed') delays.push(r);
    if(doneHere) done.push(r);
    if(st.status!=='complete'&&a.dur>0&&st.pct<pl-10) behind.push(r);
    if(st.note) notes.push(r);
  });
  const srt=(x,y)=>order.indexOf(x.st.area)-order.indexOf(y.st.area)||x.a.t0-y.a.t0;
  [delays,done,behind,notes].forEach(l=>l.sort(srt));
  return {w,shift,tot,groups:[...groups.entries()].sort((x,y)=>order.indexOf(x[0])-order.indexOf(y[0])),delays,done,behind,notes};
}
function reportText(d){
  const L=[]; const label=SHIFT_LABEL[d.shift];
  L.push(`COLETO OUTAGE - ${label} - ${fmt(d.w[0]).slice(0,10)}`);
  L.push(`Window ${fmt(d.w[0])} to ${fmt(d.w[1])}`);
  L.push(`Overall ${pctOf(d.tot)}% vs plan ${planOf(d.tot)}% | ${d.tot.complete} complete, ${d.tot.progress} in progress, ${d.tot.delayed} delayed (${d.tot.dh} hrs), ${d.tot.notstarted} not started`);
  L.push('','BY GROUP');
  d.groups.forEach(([n,g])=>{ const sup=supFor(n,d.shift==='both'?'':d.shift); L.push(`- ${n}${sup?' ('+sup+')':''}: ${pctOf(g)}% vs plan ${planOf(g)}% | ${g.complete} done, ${g.progress} active, ${g.delayed} delayed`); });
  const line=(r,extra)=>`- ${r.a.id} ${r.a.nm} [${r.st.area}]${extra?': '+extra:''}`;
  if(d.delays.length){ L.push('',`DELAYS (${d.delays.length})`); d.delays.forEach(r=>L.push(line(r,`${r.st.reason||'reason not set'}, ${r.st.hrs?r.st.hrs+' hrs':'duration not set'}${r.st.note?' - '+r.st.note:''}`))); }
  if(d.done.length){ L.push('',`COMPLETED (${d.done.length})`); d.done.slice(0,40).forEach(r=>L.push(line(r,''))); if(d.done.length>40) L.push(`... and ${d.done.length-40} more`); }
  if(d.behind.length){ L.push('',`BEHIND PLAN (${d.behind.length})`); d.behind.slice(0,30).forEach(r=>L.push(line(r,`${r.st.pct}% vs plan ${r.pl}%`))); if(d.behind.length>30) L.push(`... and ${d.behind.length-30} more`); }
  if(d.notes.length){ L.push('',`NOTES (${d.notes.length})`); d.notes.slice(0,30).forEach(r=>L.push(line(r,r.st.note))); }
  return L.join('\n');
}

  }

  if(d.behind.length) table('Behind Plan',['Activity ID','Activity','Group','Supervisor','% complete','Plan %','Status','Planned finish'],[13,60,26,18,11,9,14,18],d.behind.map(r=>[r.a.id,r.a.nm,r.st.area,r.sup,r.st.pct/100,r.pl/100,ST_LABEL[r.st.status],fmt(r.a.t1)])).eachRow((row,i)=>{ if(i>4){ row.getCell(5).numFmt='0%'; row.getCell(6).numFmt='0%'; } });
  if(d.notes.length) table('Notes',['Activity ID','Activity','Group','Supervisor','Note'],[13,60,26,18,60],d.notes.map(r=>[r.a.id,r.a.nm,r.st.area,r.sup,r.st.note]));
  return saveBook(wb,`Coleto_Shift_Report_${date}_${d.shift}.xlsx`);

(async()=>{
  const CK='coleto-code', hdr=()=>{ let c=''; try{ c=localStorage.getItem(CK)||''; }catch(e){} return {'Content-Type':'application/json','x-code':c}; };
  let lastW=0;
  async function pull(first){
    const r=await fetch('/api/sync',{headers:hdr(),cache:'no-store'});
    if(r.status===401){ let c=prompt(first?'Enter the team access code':'Access code was rejected. Enter it again'); if(c===null) throw new Error('code'); try{ localStorage.setItem(CK,c.trim()); }catch(e){} return pull(false); }
    if(!r.ok) throw new Error('status '+r.status);
    return r.json();
  }
  function apply(d){
    if(Date.now()-lastW<3000) return;
    const m={...S.progress}; let ch=false;
    Object.keys(d.progress||{}).forEach(k=>{ const v=d.progress[k], o=m[k]; if(!o||!o.u||(v.u||0)>=o.u){ if(JSON.stringify(o)!==JSON.stringify(v)){ m[k]=v; ch=true; } } });
    if(ch) S.progress=m;
    if(d.crews&&Array.isArray(d.crews.groups)&&JSON.stringify(d.crews.groups)!==JSON.stringify(S.crews)){ S.crews=d.crews.groups; d.crews.groups.forEach(g=>{ if(g.custom) S.areas.add(g.name); }); ch=true; }
    if(ch) softRender();
  }
  async function post(body){ lastW=Date.now(); const r=await fetch('/api/sync',{method:'POST',headers:hdr(),body:JSON.stringify(body)}); if(!r.ok) throw new Error('status '+r.status); }
  let d0;
  try{ d0=await pull(true); }
  catch(e){ $('banner').innerHTML='<div class="banner">Shared saving is not connected. Changes stay in this browser only.</div>'; return; }
  // one-time: push anything saved only in this browser before sharing was on
  S.db={ doc(path){ return { set(data){
